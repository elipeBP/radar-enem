<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/radar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Radar ENEM</title>
    <script>
      // Aplica o tema ANTES do primeiro paint, pra nunca piscar o tema
      // errado (FOUC) -- mesma chave lida por src/hooks/useTheme.js.
      (function () {
        try {
          var salvo = localStorage.getItem("radar-enem-tema");
          var escuro =
            salvo === "escuro" ||
            (!salvo && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.classList.add("dark");
        } catch {
          // localStorage indisponível (modo privado etc.) -- fica no claro.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
