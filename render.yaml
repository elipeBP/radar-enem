# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Conectar o repo no Render com este arquivo na raiz evita reconfigurar os
# campos abaixo manualmente no painel a cada novo serviço/ambiente.
#
# Os Parquets de produção (Backend/etl/producao/*.parquet) nunca são
# commitados (.gitignore) -- o Dockerfile os baixa de uma GitHub Release
# durante o build (ver comentário lá), então nenhuma variável de ambiente
# extra é necessária aqui.
services:
  - type: web
    name: radar-enem
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
